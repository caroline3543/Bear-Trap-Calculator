<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timers</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F1;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",sans-serif;color:#18201C;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:0}
.eyebrow{font-size:13px;line-height:18px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#68736D}
.card{background:#fff;border:1px solid #DDE2DB;border-radius:24px}
.num{font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid #DDE2DB;display:inline-flex;align-items:center;justify-content:center;color:#18201C}
.seg{height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;background:#fff;border:1px solid #DDE2DB;color:#18201C;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.seg.on{background:#29483A;border-color:#29483A;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sec{display:flex;align-items:center;gap:16px;padding:16px 20px;min-height:88px;background:none;width:100%;text-align:left;color:inherit;border-top:1px solid #DDE2DB}
.sec:first-child{border-top:0}
.sec-ic{width:44px;height:44px;border-radius:50%;background:#EEF1EB;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#29483A}
.sec-title{font-size:18px;line-height:24px;font-weight:650}
.sec-sum{font-size:15px;line-height:21px;font-weight:500;color:#68736D;margin-top:2px}
.sec-sum b{color:#18201C;font-weight:600}
.badge{height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;background:#EEF1EB;color:#18201C}
.badge.act{background:#DDF56F}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;color:#68736D;font-size:13px;font-weight:600;padding:8px 0;height:64px;justify-content:center}
.tab .pill{width:56px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tab.on{color:#18201C}
.tab.on .pill{background:#DDF56F}
</style>

</head>
<body>


<div style="position:relative;width:390px;height:1120px;background:#F5F6F1;padding:24px 24px 0;display:flex;flex-direction:column;gap:24px">

  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div class="eyebrow">4 accounts</div>
      <h1 style="font-size:30px;line-height:36px;font-weight:700;margin-top:4px">Timers</h1>
    </div>
    <button class="iconbtn" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></button>
  </div>

  <!-- account filter: one row, scrolls sideways -->
  <div style="display:flex;gap:8px;margin:0 -24px;padding:0 24px;overflow:hidden">
    <button class="seg on">All accounts</button>
    <button class="seg"><span class="dot" style="background:#29483A"></span>Caroline</button>
    <button class="seg"><span class="dot" style="background:#B7791F"></span>Farm 1</button>
    <button class="seg"><span class="dot" style="background:#3E5FA8"></span>Farm 2</button>
  </div>

  <!-- LEVEL 1: what finishes next -->
  <div style="background:#29483A;border-radius:24px;padding:24px;color:#fff;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="eyebrow" style="color:#DDF56F">Finishes next</span>
      <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:500;color:#C9D9CF"><span class="dot" style="background:#8FA9E8"></span>Farm 2</span>
    </div>
    <div>
      <div style="font-size:22px;line-height:28px;font-weight:700">All camps · Training</div>
      <div class="num" style="font-size:36px;line-height:42px;font-weight:700;color:#DDF56F;margin-top:4px">02:08:59</div>
      <div class="num" style="font-size:15px;line-height:21px;font-weight:500;color:#C9D9CF;margin-top:4px">Finishes 7:39 PM · 07:39 UTC</div>
    </div>
  </div>

  <!-- LEVEL 3: every section, one line each, one card -->
  <div class="card" style="overflow:hidden">
    <button class="sec">
      <span class="sec-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg></span>
      <span style="flex:1;min-width:0"><span style="display:flex;align-items:center;gap:8px"><span class="sec-title">Chief stamina</span><span class="badge act">Action</span></span><span class="sec-sum" style="display:block"><b>Farm 1</b> hits 200 in 20m</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#68736D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="sec">
      <span class="sec-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 6-4 0 2-6z"/></svg></span>
      <span style="flex:1;min-width:0"><span class="sec-title" style="display:block">Tundra Trek</span><span class="sec-sum" style="display:block">Next claim <b>8:00 PM</b></span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#68736D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="sec">
      <span class="sec-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg></span>
      <span style="flex:1;min-width:0"><span style="display:flex;align-items:center;gap:8px"><span class="sec-title">Training camps</span><span class="badge num">6</span></span><span class="sec-sum" style="display:block">Next <b class="num">02:08:59</b> · <b>3 idle</b></span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#68736D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="sec">
      <span class="sec-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/></svg></span>
      <span style="flex:1;min-width:0"><span style="display:flex;align-items:center;gap:8px"><span class="sec-title">Research</span><span class="badge num">2</span></span><span class="sec-sum" style="display:block">Next <b>Dawn Academy</b> · <b class="num">03:56:59</b></span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#68736D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="sec">
      <span class="sec-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>
      <span style="flex:1;min-width:0"><span style="display:flex;align-items:center;gap:8px"><span class="sec-title">Contributions</span><span class="badge act">3 full</span></span><span class="sec-sum" style="display:block">Next +1 in <b class="num">09:59</b></span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#68736D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- the one common action, right where it's needed -->
  <button style="height:52px;border-radius:14px;background:#DDF56F;color:#18201C;font-size:16px;font-weight:600;width:100%">Spend all · 3 full accounts</button>

  <div style="position:absolute;left:0;right:0;bottom:0;height:80px;background:#fff;border-top:1px solid #DDE2DB;display:flex;padding:8px 12px 8px">
    <button class="tab"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>Today</button>
    <button class="tab on"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></svg></span>Timers</button>
    <button class="tab"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg></span>Events</button>
    <button class="tab"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 8h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></svg></span>Calculator</button>
  </div>
</div>

</body>
</html>
